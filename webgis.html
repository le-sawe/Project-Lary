<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Lary – WebGIS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/webgis.css">
</head>
<body class="webgis-page">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container-fluid px-3">
      <a class="navbar-brand fw-bold" href="home.html">Project Lary</a>
      <ul class="navbar-nav ms-auto flex-row gap-2">
        <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="results.html">Results</a></li>
        <li class="nav-item"><a class="nav-link active" href="webgis.html">WebGIS</a></li>
      </ul>
    </div>
  </nav>

  <!-- Map fills the viewport below the navbar -->
  <div id="map"></div>

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside id="sidebar">

    <!-- Basemap -->
    <div class="sb-card">
      <div class="sb-card-title">Base Map</div>
      <div class="basemap-btns">
        <button class="bm-btn active" data-style="dark">Dark</button>
        <button class="bm-btn" data-style="streets">Streets</button>
        <button class="bm-btn" data-style="satellite">Satellite</button>
        <button class="bm-btn" data-style="osm">OSM</button>
      </div>
    </div>

    <!-- Pollution group tabs + layer list -->
    <div class="sb-card sb-card-grow">
      <div class="sb-card-title">Layers</div>
      <div id="group-tabs" class="group-tabs"></div>
      <div id="layer-list" class="layer-list"></div>
    </div>

  </aside>

  <!-- ── Legend ───────────────────────────────────────────────────────────── -->
  <div id="legend" style="display:none"></div>

  <!-- ── Floating pie-chart panel ─────────────────────────────────────────── -->
  <div id="pie-panel">
    <div class="pie-panel-header">
      <span id="pie-panel-title"></span>
      <button id="pie-panel-close" title="Close">✕</button>
    </div>
    <div class="pie-panel-body">
      <canvas id="pie-panel-canvas"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
