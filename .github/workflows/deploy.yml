name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate tiles
        run: python process_rasters.py

      - name: Prepare deployment
        run: |
          mkdir dist
          cp *.html dist/
          cp *.css dist/
          cp metadata.json dist/
          cp -r tiles dist/
          mkdir -p dist/Data/no2
          cp Data/no2/zonal_CSV.csv dist/Data/no2/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
